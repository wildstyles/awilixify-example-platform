global:
  image:
    # The Makefile supplies a tag for every install. An empty default prevents
    # accidentally deploying a mutable or implicit latest tag.
    tag: ""
    pullPolicy: IfNotPresent

ingress:
  # The AWS Load Balancer Controller turns this Kubernetes Ingress into one
  # public Application Load Balancer. Local Kubernetes disables it below.
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Route directly to Pod IPs, so the existing Services stay ClusterIP-only.
    alb.ingress.kubernetes.io/target-type: ip

ordersApi:
  replicas: 1
  image:
    repository: awilixify-example-platform/orders-api
  service:
    httpPort: 3000
    devtoolsPort: 3221
  config:
    deploymentEnvironment: aws-eks
    publicAppUrl: http://localhost:3000
    serviceName: orders
    warehouseApiUrl: http://warehouse-api:3001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

warehouseApi:
  replicas: 1
  image:
    repository: awilixify-example-platform/warehouse-api
  service:
    httpPort: 3001
    devtoolsPort: 3223
  config:
    deploymentEnvironment: aws-eks
    publicAppUrl: http://localhost:3001
    serviceName: warehouse
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

devtoolsUi:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/awilixify/awilixify-devtools-ui
    tag: 0.1.1
    pullPolicy: IfNotPresent
  service:
    port: 3222
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

rabbitmq:
  # EKS runs RabbitMQ in-cluster for this learning project, but credentials are
  # synchronized from AWS Secrets Manager rather than stored in Helm values.
  enabled: true
  host: rabbitmq
  image:
    repository: rabbitmq
    tag: 4-management
    pullPolicy: IfNotPresent
  auth:
    username: ""
    password: ""
  # Name of the Kubernetes Secret consumed by RabbitMQ and both APIs. In EKS,
  # ExternalSecret creates this target Secret from the AWS value.
  existingSecret: rabbitmq-credentials
  service:
    amqpPort: 5672
    managementPort: 15672
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

secrets:
  # Enables synchronization from AWS Secrets Manager. values.local.yaml
  # disables it because Minikube has no AWS Pod Identity.
  enabled: true
  region: eu-west-1
  refreshInterval: 1m
  rabbitmq:
    remoteName: awilixify-example-platform/rabbitmq
