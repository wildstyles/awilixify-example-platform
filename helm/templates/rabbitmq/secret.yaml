{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "awilixify-example-platform.rabbitmqSecretName" . }}
  labels:
    {{- include "awilixify-example-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.rabbitmq.auth.username | quote }}
  password: {{ .Values.rabbitmq.auth.password | quote }}
  url: {{ printf "amqp://%s:%s@%s:%v" .Values.rabbitmq.auth.username .Values.rabbitmq.auth.password .Values.rabbitmq.host .Values.rabbitmq.service.amqpPort | quote }}
{{- end }}
