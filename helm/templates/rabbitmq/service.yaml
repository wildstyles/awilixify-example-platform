{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    {{- include "awilixify-example-platform.labels" . | nindent 4 }}
spec:
  # Routes traffic to Pods carrying this label.
  selector:
    app: rabbitmq
  # `port` is exposed by the Service; `targetPort` forwards to the named
  # container port in the selected Pod.
  ports:
    - name: amqp
      port: {{ .Values.rabbitmq.service.amqpPort }}
      targetPort: amqp
    - name: management
      port: {{ .Values.rabbitmq.service.managementPort }}
      targetPort: management
{{- end }}
