{{- if .Values.secrets.enabled }}
# ExternalSecret is not a native Kubernetes kind. It is a Custom Resource
# Definition (CRD) installed by the External Secrets Operator Helm chart. Without
# that installation, Kubernetes does not recognize this manifest.
#
# Mental model: ExternalSecret is a higher-level orchestrator/recipe for a
# concrete native Kubernetes Secret. It cannot be consumed by Pods itself. The
# operator follows these instructions, reads the RabbitMQ JSON from AWS, and
# creates/updates the normal Secret used by the Deployments.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
  labels:
    {{- include "awilixify-example-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ required "rabbitmq.existingSecret is required when external secrets are enabled" .Values.rabbitmq.existingSecret }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secrets.rabbitmq.remoteName | quote }}
{{- end }}
