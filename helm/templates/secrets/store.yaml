{{- if .Values.secrets.enabled }}
# AWS Secrets Manager is the external AWS service that stores and versions the
# real secret values, much like ECR stores images and EKS runs Kubernetes.
#
# SecretStore is not a native Kubernetes kind. It is a Custom Resource Definition
# (CRD) installed by the External Secrets Operator Helm chart. It describes which
# external provider the operator should call and in which region. It contains no
# application secret values, does not create a Pod, and cannot be consumed by
# application Pods. Authentication comes from the operator's EKS Pod Identity,
# so no permanent AWS access keys are placed in this chart.
#
# ExternalSecret resources reference this store to select external values and
# create/update normal Kubernetes Secret objects. Multiple application secrets
# can reuse this store; normal Secret objects cannot reference SecretStore.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  labels:
    {{- include "awilixify-example-platform.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secrets.region | quote }}
{{- end }}
