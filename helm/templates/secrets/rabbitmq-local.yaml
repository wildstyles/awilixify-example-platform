{{- if and .Values.rabbitmq.enabled (not .Values.rabbitmq.existingSecret) }}
# Secret is a native Kubernetes kind and the actual object that Pods consume
# through secretKeyRef. Minikube has no External Secrets Operator, so Helm creates
# this Secret directly from the intentionally non-production values in
# values.local.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "awilixify-example-platform.rabbitmqSecretName" . }}
  labels:
    {{- include "awilixify-example-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.rabbitmq.auth.username | quote }}
  password: {{ .Values.rabbitmq.auth.password | quote }}
{{- end }}
