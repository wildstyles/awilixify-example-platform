apiVersion: v1
kind: Service
metadata:
  name: orders-api
  labels:
    {{- include "awilixify-example-platform.labels" . | nindent 4 }}
  {{- if .Values.ingress.enabled }}
  # The ALB uses the API's readiness endpoint instead of treating a 404 at `/`
  # as an unhealthy target.
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
  {{- end }}
spec:
  # Routes traffic to Pods carrying this label.
  selector:
    app: orders-api
  # `port` is exposed by the Service; `targetPort` forwards to the named
  # container port in the selected Pod.
  ports:
    # Application traffic; a future Ingress can route to this named port.
    - name: http
      port: {{ .Values.ordersApi.service.httpPort }}
      targetPort: http
    # Cluster-internal DevTools traffic used by the DevTools UI proxy.
    - name: devtools
      port: {{ .Values.ordersApi.service.devtoolsPort }}
      targetPort: devtools
