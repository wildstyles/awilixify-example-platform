ordersApi:
  config:
    deploymentEnvironment: local-kubernetes

warehouseApi:
  config:
    deploymentEnvironment: local-kubernetes

rabbitmq:
  # The local cluster is self-contained. These credentials are intentionally
  # non-production and must never be reused for a remote environment.
  enabled: true
  host: rabbitmq
  # Clear the AWS Secret name so the chart creates a local demo Secret instead.
  existingSecret: ""
  auth:
    username: awilixify
    password: awilixify

secrets:
  enabled: false
