name: Terraform

on:
  workflow_dispatch:
    inputs:
      # Platform and EKS use separate Terraform state. This lets us destroy the
      # costly learning cluster without deleting persistent ECR images or secrets.
      stack:
        description: Terraform stack
        required: true
        type: choice
        options:
          - platform
          - eks
      operation:
        description: Terraform operation
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm_destroy:
        description: Type destroy-eks when destroying the EKS stack
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.stack }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  CLUSTER_NAME: awilixify-example-platform
  ECR_NAMESPACE: awilixify-example-platform
  DOMAIN_NAME: awilixify.site
  TF_WORKING_DIR: terraform/${{ inputs.stack }}
  TF_STATE_BUCKET: awilixify-example-platform-${{ vars.AWS_ACCOUNT_ID }}-terraform-state
  # Terraform reads TF_VAR_<name> implicitly, so this environment variable
  # becomes var.admin_role_arn without being passed in the plan command. The EKS
  # stack uses it to grant the Identity Center role access to the cluster.
  TF_VAR_admin_role_arn: ${{ vars.AWS_ADMIN_ROLE_ARN }}

jobs:
  terraform:
    name: ${{ inputs.operation }} ${{ inputs.stack }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check repository configuration
        shell: bash
        run: |
          if [[ -z "${{ vars.AWS_ACCOUNT_ID }}" ]]; then
            echo "Set the AWS_ACCOUNT_ID repository variable." >&2
            exit 1
          fi
          if [[ "${{ inputs.stack }}" == "eks" && -z "${{ vars.AWS_ADMIN_ROLE_ARN }}" ]]; then
            echo "Set AWS_ADMIN_ROLE_ARN to your IAM Identity Center role ARN." >&2
            exit 1
          fi
          if [[ "${{ inputs.operation }}" == "destroy" ]]; then
            if [[ "${{ inputs.stack }}" != "eks" || "${{ inputs.confirm_destroy }}" != "destroy-eks" ]]; then
              echo "Only EKS may be destroyed, with confirm_destroy set to destroy-eks." >&2
              exit 1
            fi
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/awilixify-example-platform-github-terraform

      # Helmfile destroys releases in reverse dependency order: monitoring,
      # application/Ingress, then controllers. That lets the load-balancer
      # controller delete the ALB before Terraform removes EKS.
      - name: Connect to EKS for release cleanup
        id: eks_cleanup
        if: inputs.stack == 'eks' && inputs.operation == 'destroy'
        shell: bash
        run: |
          if ! aws eks describe-cluster --region "${AWS_REGION}" --name "${CLUSTER_NAME}" >/dev/null 2>&1; then
            echo "EKS cluster is already absent; continuing Terraform cleanup."
            echo "cluster_exists=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          vpc_id="$(aws eks describe-cluster \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}" \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text)"
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"
          echo "cluster_exists=true" >> "${GITHUB_OUTPUT}"
          echo "vpc_id=${vpc_id}" >> "${GITHUB_OUTPUT}"

      - name: Remove Kubernetes-managed AWS resources
        if: >-
          inputs.stack == 'eks' &&
          inputs.operation == 'destroy' &&
          steps.eks_cleanup.outputs.cluster_exists == 'true'
        uses: helmfile/helmfile-action@v2.2.0
        env:
          # Helmfile renders its desired state before deletion. These values are
          # placeholders only; destroy never installs or upgrades the charts.
          IMAGE_TAG: destroy
          ECR_REGISTRY: unused
          VPC_ID: ${{ steps.eks_cleanup.outputs.vpc_id }}
        with:
          helmfile-version: v1.7.1
          helm-version: v3.21.3
          helm-plugins: https://github.com/databus23/helm-diff@v3.15.7
          # Helmfile 1.x exposes these destroy-specific flags in camelCase.
          helmfile-args: destroy --skip-charts --deleteWait --deleteTimeout 900
          helmfile-auto-init: "false"

      # The load-balancer controller creates frontend and shared backend
      # security groups directly in AWS, outside both Helm and Terraform state.
      # Usually its Ingress finalizer removes them. During full-cluster teardown,
      # AWS propagation or stopping the controller can leave an unattached group
      # briefly behind, which prevents Terraform from deleting the VPC.
      - name: Remove orphaned load-balancer security groups
        if: >-
          inputs.stack == 'eks' &&
          inputs.operation == 'destroy' &&
          steps.eks_cleanup.outputs.cluster_exists == 'true'
        env:
          VPC_ID: ${{ steps.eks_cleanup.outputs.vpc_id }}
        shell: bash
        run: |
          for attempt in {1..60}; do
            group_ids="$(aws ec2 describe-security-groups \
              --region "${AWS_REGION}" \
              --filters \
                "Name=vpc-id,Values=${VPC_ID}" \
                "Name=tag:elbv2.k8s.aws/cluster,Values=${CLUSTER_NAME}" \
              --query 'SecurityGroups[].GroupId' \
              --output text)"

            if [[ -z "${group_ids}" || "${group_ids}" == "None" ]]; then
              echo "No load-balancer controller security groups remain."
              exit 0
            fi

            echo "Waiting for AWS dependencies, then deleting: ${group_ids}"
            for group_id in ${group_ids}; do
              aws ec2 delete-security-group \
                --region "${AWS_REGION}" \
                --group-id "${group_id}" || true
            done

            sleep 10
          done

          echo "Load-balancer security groups still exist after 10 minutes." >&2
          exit 1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.14.6

      - name: Initialize Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: >-
          terraform init
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="region=${AWS_REGION}"

      - name: Check formatting
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Validate configuration
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Create plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          if [[ "${{ inputs.operation }}" == "destroy" ]]; then
            terraform plan -destroy -input=false -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi

      - name: Apply saved plan
        if: inputs.operation != 'plan'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan
