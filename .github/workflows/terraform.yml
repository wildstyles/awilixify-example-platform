name: Terraform

on:
  workflow_dispatch:
    inputs:
      # Platform and EKS use separate Terraform state. This lets us destroy the
      # costly learning cluster without deleting persistent ECR images or secrets.
      stack:
        description: Terraform stack
        required: true
        type: choice
        options:
          - platform
          - eks
      operation:
        description: Terraform operation
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm_destroy:
        description: Type destroy-eks when destroying the EKS stack
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.stack }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  CLUSTER_NAME: awilixify-example-platform
  NAMESPACE: awilixify-example-platform
  TF_WORKING_DIR: terraform/${{ inputs.stack }}
  TF_STATE_BUCKET: awilixify-example-platform-${{ vars.AWS_ACCOUNT_ID }}-terraform-state
  # Terraform reads TF_VAR_<name> implicitly, so this environment variable
  # becomes var.admin_role_arn without being passed in the plan command. The EKS
  # stack uses it to grant the Identity Center role access to the cluster.
  TF_VAR_admin_role_arn: ${{ vars.AWS_ADMIN_ROLE_ARN }}

jobs:
  terraform:
    name: ${{ inputs.operation }} ${{ inputs.stack }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check repository configuration
        shell: bash
        run: |
          if [[ -z "${{ vars.AWS_ACCOUNT_ID }}" ]]; then
            echo "Set the AWS_ACCOUNT_ID repository variable." >&2
            exit 1
          fi
          if [[ "${{ inputs.stack }}" == "eks" && -z "${{ vars.AWS_ADMIN_ROLE_ARN }}" ]]; then
            echo "Set AWS_ADMIN_ROLE_ARN to your IAM Identity Center role ARN." >&2
            exit 1
          fi
          if [[ "${{ inputs.operation }}" == "destroy" ]]; then
            if [[ "${{ inputs.stack }}" != "eks" || "${{ inputs.confirm_destroy }}" != "destroy-eks" ]]; then
              echo "Only EKS may be destroyed, with confirm_destroy set to destroy-eks." >&2
              exit 1
            fi
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/awilixify-example-platform-github-terraform

      # Ingress owns an AWS load balancer outside Kubernetes. Delete the Helm
      # release first so its controller can remove the ALB before Terraform
      # deletes the cluster. Repeated destroys remain safe if EKS is gone.
      - name: Remove Kubernetes-managed AWS resources
        if: inputs.stack == 'eks' && inputs.operation == 'destroy'
        shell: bash
        run: |
          if ! aws eks describe-cluster --region "${AWS_REGION}" --name "${CLUSTER_NAME}" >/dev/null 2>&1; then
            echo "EKS cluster is already absent; continuing Terraform cleanup."
            exit 0
          fi

          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"
          helm uninstall awilixify-example-platform \
            --namespace "${NAMESPACE}" \
            --ignore-not-found \
            --wait \
            --timeout 10m
          helm uninstall external-dns \
            --namespace external-dns \
            --ignore-not-found \
            --wait \
            --timeout 5m
          helm uninstall aws-load-balancer-controller \
            --namespace kube-system \
            --ignore-not-found \
            --wait \
            --timeout 5m
          helm uninstall external-secrets \
            --namespace external-secrets \
            --ignore-not-found \
            --wait \
            --timeout 5m

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.14.6

      - name: Initialize Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: >-
          terraform init
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="region=${AWS_REGION}"

      - name: Check formatting
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Validate configuration
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Create plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          if [[ "${{ inputs.operation }}" == "destroy" ]]; then
            terraform plan -destroy -input=false -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi

      - name: Apply saved plan
        if: inputs.operation != 'plan'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan
