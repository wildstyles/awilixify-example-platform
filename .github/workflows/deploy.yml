---
name: Deploy to EKS
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable ECR image tag, for example 0.1.1
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-eks
  cancel-in-progress: false
env:
  AWS_REGION: eu-west-1
  CLUSTER_NAME: awilixify-example-platform
  NAMESPACE: awilixify-example-platform
  ECR_NAMESPACE: awilixify-example-platform
  DOMAIN_NAME: awilixify.site
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check repository configuration
        shell: bash
        run: |
          if [[ -z "${{ vars.AWS_ACCOUNT_ID }}" ]]; then
            echo "Set the AWS_ACCOUNT_ID repository variable." >&2
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/awilixify-example-platform-github-deployer
      - name: Confirm both images exist
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          for service in orders-api warehouse-api; do
            aws ecr describe-images \
              --repository-name "${ECR_NAMESPACE}/${service}" \
              --image-ids "imageTag=${IMAGE_TAG}" >/dev/null
          done
      - name: Connect kubectl to EKS
        shell: bash
        run: |
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"
          vpc_id="$(aws eks describe-cluster \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}" \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text)"
          if [[ -z "${vpc_id}" || "${vpc_id}" == "None" ]]; then
            echo "Could not discover the EKS cluster VPC ID." >&2
            exit 1
          fi
          echo "VPC_ID=${vpc_id}" >> "${GITHUB_ENV}"

      # Helmfile holds the complete release inventory, pinned chart versions,
      # values, namespaces, and dependency order. Apply reconciles only the
      # releases whose desired state differs from the cluster.
      - name: Reconcile Helm releases
        uses: helmfile/helmfile-action@v2.2.0
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com
        with:
          helmfile-version: v1.7.1
          helm-version: v3.21.3
          helm-plugins: https://github.com/databus23/helm-diff@v3.15.7
          # A fresh EKS cluster has no releases or operator CRDs to diff yet.
          helmfile-args: apply --skip-diff-on-install
          helmfile-auto-init: "false"

      # Helm does not wait for controller-managed ALB listeners or Route 53
      # changes. Curl retries until ExternalDNS publishes both names and the
      # ALB can complete a trusted TLS handshake with the discovered ACM cert.
      - name: Verify public HTTPS
        shell: bash
        run: |
          for hostname in "api.${DOMAIN_NAME}" "devtools.${DOMAIN_NAME}"; do
            curl --silent --show-error --output /dev/null \
              --retry 30 \
              --retry-all-errors \
              --retry-delay 10 \
              --retry-max-time 600 \
              --connect-timeout 10 \
              --max-time 20 \
              "https://${hostname}/"
          done
      - name: Show deployment status
        run: |-
          kubectl get externalsecret,pods,services,ingress --namespace "${NAMESPACE}"
          kubectl get pods --namespace external-dns
          kubectl get externalsecret,secret --namespace monitoring
          kubectl get pods --namespace monitoring
          kubectl get nodes

      # Helm's timeout alone does not explain whether a Pod was pending,
      # crashing, unable to pull its image, or missing AWS credentials.
      - name: Show failure diagnostics
        if: failure()
        shell: bash
        run: |
          kubectl get nodes --output wide || true
          kubectl get pods --all-namespaces --output wide || true
          kubectl get prometheus,servicemonitor,podmonitor \
            --all-namespaces || true
          kubectl describe deployment aws-load-balancer-controller \
            --namespace kube-system || true
          kubectl logs deployment/aws-load-balancer-controller \
            --namespace kube-system \
            --all-containers \
            --tail=200 || true
          kubectl get events --all-namespaces \
            --sort-by=.lastTimestamp | tail -n 100 || true
