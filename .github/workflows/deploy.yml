---
name: Deploy to EKS
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable ECR image tag, for example 0.1.1
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-eks
  cancel-in-progress: false
env:
  AWS_REGION: eu-west-1
  CLUSTER_NAME: awilixify-example-platform
  NAMESPACE: awilixify-example-platform
  ECR_NAMESPACE: awilixify-example-platform
  DOMAIN_NAME: awilixify.site
  EXTERNAL_SECRETS_VERSION: 2.8.0
  EXTERNAL_DNS_VERSION: 1.21.1
  LOAD_BALANCER_CONTROLLER_VERSION: 3.5.0
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check repository configuration
        shell: bash
        run: |
          if [[ -z "${{ vars.AWS_ACCOUNT_ID }}" ]]; then
            echo "Set the AWS_ACCOUNT_ID repository variable." >&2
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/awilixify-example-platform-github-deployer
      - name: Confirm both images exist
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          for service in orders-api warehouse-api; do
            aws ecr describe-images \
              --repository-name "${ECR_NAMESPACE}/${service}" \
              --image-ids "imageTag=${IMAGE_TAG}" >/dev/null
          done
      - name: Connect kubectl to EKS
        shell: bash
        run: |
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"
          vpc_id="$(aws eks describe-cluster \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}" \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text)"
          if [[ -z "${vpc_id}" || "${vpc_id}" == "None" ]]; then
            echo "Could not discover the EKS cluster VPC ID." >&2
            exit 1
          fi
          echo "VPC_ID=${vpc_id}" >> "${GITHUB_ENV}"

      # This published Helm chart installs External Secrets Operator as a
      # separate controller running in the cluster. It watches SecretStore and
      # ExternalSecret objects created by our application chart, reads AWS
      # Secrets Manager using Pod Identity, and creates/updates normal
      # Kubernetes Secrets consumed by Pods.
      #
      # `upgrade --install` is idempotent: the first deployment installs the
      # tool; later deployments check the existing release and change it only
      # when its pinned version or configuration changes.
      - name: Install External Secrets Operator
        shell: bash
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update external-secrets
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --version "${EXTERNAL_SECRETS_VERSION}" \
            --set serviceAccount.name=external-secrets \
            --wait \
            --timeout 5m

      # This controller watches our Ingress and creates the corresponding AWS
      # ALB. Pod Identity supplies its AWS credentials; Helm installs only the
      # controller's Kubernetes resources.
      - name: Install AWS Load Balancer Controller
        shell: bash
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update eks
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --version "${LOAD_BALANCER_CONTROLLER_VERSION}" \
            --set clusterName="${CLUSTER_NAME}" \
            --set region="${AWS_REGION}" \
            --set vpcId="${VPC_ID}" \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set replicaCount=1 \
            --wait \
            --timeout 10m

      # ExternalDNS watches Ingress host rules and creates Route 53 records
      # pointing them at the ALB. Its Pod Identity role is
      # restricted to this project's public hosted zone.
      - name: Install ExternalDNS
        shell: bash
        run: |
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo update external-dns
          helm upgrade --install external-dns external-dns/external-dns \
            --namespace external-dns \
            --create-namespace \
            --version "${EXTERNAL_DNS_VERSION}" \
            --set-string provider.name=aws \
            --set-string serviceAccount.name=external-dns \
            --set-string policy=sync \
            --set-string txtOwnerId="${CLUSTER_NAME}" \
            --set-string "domainFilters[0]=${DOMAIN_NAME}" \
            --set-string "sources[0]=ingress" \
            --set-string "env[0].name=AWS_DEFAULT_REGION" \
            --set-string "env[0].value=${AWS_REGION}" \
            --set-string extraArgs.aws-zone-type=public \
            --set triggerLoopOnEvent=true \
            --wait \
            --timeout 5m
      - name: Deploy application chart
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com
        shell: bash
        run: |
          helm upgrade --install awilixify-example-platform ./helm \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --set-string global.image.tag="${IMAGE_TAG}" \
            --set-string ordersApi.image.repository="${ECR_REGISTRY}/${ECR_NAMESPACE}/orders-api" \
            --set-string warehouseApi.image.repository="${ECR_REGISTRY}/${ECR_NAMESPACE}/warehouse-api" \
            --wait \
            --timeout 10m

      # Helm does not wait for controller-managed ALB listeners or Route 53
      # changes. Curl retries until ExternalDNS publishes both names and the
      # ALB can complete a trusted TLS handshake with the discovered ACM cert.
      - name: Verify public HTTPS
        shell: bash
        run: |
          for hostname in "api.${DOMAIN_NAME}" "devtools.${DOMAIN_NAME}"; do
            curl --silent --show-error --output /dev/null \
              --retry 30 \
              --retry-all-errors \
              --retry-delay 10 \
              --retry-max-time 600 \
              --connect-timeout 10 \
              --max-time 20 \
              "https://${hostname}/"
          done
      - name: Show deployment status
        run: |-
          kubectl get externalsecret,pods,services,ingress --namespace "${NAMESPACE}"
          kubectl get pods --namespace external-dns
          kubectl get nodes

      # Helm's timeout alone does not explain whether a Pod was pending,
      # crashing, unable to pull its image, or missing AWS credentials.
      - name: Show failure diagnostics
        if: failure()
        shell: bash
        run: |
          kubectl get nodes --output wide || true
          kubectl get pods --all-namespaces --output wide || true
          kubectl describe deployment aws-load-balancer-controller \
            --namespace kube-system || true
          kubectl logs deployment/aws-load-balancer-controller \
            --namespace kube-system \
            --all-containers \
            --tail=200 || true
          kubectl get events --all-namespaces \
            --sort-by=.lastTimestamp | tail -n 100 || true
